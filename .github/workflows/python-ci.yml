name: Python CI

# 学习仓库的持续集成：语法检查 + 静态检查 + 自检脚本 + 单元测试
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 语法/静态/自检/测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装检查工具
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest

      - name: 语法编译检查（compileall）
        run: python -m compileall -q python

      - name: 静态检查（ruff，严重错误）
        # E9=语法错误, F63/F7=比较与断言问题, F82=未定义名称
        # 默认规则里的风格项不阻塞构建，保证构建只对真正的 bug 报警
        run: ruff check . --select=E9,F63,F7,F82 --output-format=concise

      - name: 仓库自检（运行所有可运行示例）
        run: python python/tools/smoke_test.py

      - name: 单元测试（pytest）
        run: python -m pytest
